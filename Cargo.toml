[workspace]
members = [
    "programs/*",
    # Test-only programs, never deployed (Sprint 03: the CPI proxy).
    "tests/programs/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The Solana CLI the program is built with; solana-verify picks its build image from this (Sprint 16).
[workspace.metadata.cli]
solana = "3.1.10"
