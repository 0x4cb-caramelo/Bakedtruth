name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with README "Stack" and the local toolchain.
  SOLANA_VERSION: "3.1.10"
  # Writes the brot-markets IDL from its source (T9); scripts/build-idl.ts refuses other versions.
  SHANK_VERSION: "0.4.9"
  CARGO_TERM_COLOR: always

jobs:
  program:
    name: Program
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build scripts and post-install hooks of a pull request run in this job; they do
          # not need the repository token on disk.
          persist-credentials: false

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Cache Solana CLI and platform-tools
        id: solana-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Cached by version outside target/: rust-cache prunes unknown folders under target/
      # before saving. cargo install --locked builds it from crates.io with its own lockfile.
      - name: Cache shank-cli
        id: shank-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/shank-cli
          key: shank-cli-${{ env.SHANK_VERSION }}-ubuntu-24.04-${{ runner.arch }}

      - name: Install shank-cli
        if: steps.shank-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "${SHANK_VERSION}" --root "$HOME/.local/share/shank-cli" shank-cli

      - name: Add shank-cli to PATH
        run: echo "$HOME/.local/share/shank-cli/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Toolchain versions
        run: |
          rustc --version
          solana --version
          cargo build-sbf --version
          shank --version
          bun --version

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          bun run lint

      # Without this cargo re-resolves in silence when Cargo.toml and Cargo.lock disagree, and
      # the program is built from versions nobody committed.
      - name: Cargo.lock matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The same build developers run: cargo build-sbf for brot-markets and for the test-only CPI
      # proxy, then the Shank IDL and the Codama client (bun run idl). Removing the committed
      # outputs first means one the build did not regenerate shows up as deleted in the check
      # below, instead of passing as "unchanged".
      - name: Build programs and IDL
        run: |
          rm -rf packages/sdk/src/idl/brot_markets.json packages/sdk/src/idl/generated
          bun run build:program

      # Developers whose machine cannot run the pinned toolchain take the generated IDL from
      # here. It holds no program binary, so it is safe to publish from any branch. The IDL
      # itself needs no Solana toolchain: `bun run idl` with shank-cli 0.4.9.
      - name: Upload generated IDL (preview, not deployable)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: idl-preview-${{ github.run_id }}
          path: packages/sdk/src/idl/
          if-no-files-found: error
          retention-days: 7

      # `git status` rather than `git diff`: a generated file that was never committed is
      # untracked, and `git diff` does not see it. Covers the Codama client too (X0.6).
      - name: Check committed IDL is up to date
        run: |
          stale="$(git status --porcelain -- packages/sdk/src/idl)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::IDL is stale. Run 'bun run idl' and commit the result."
            exit 1
          fi

      - name: Slot matrix is current (generated from the IDL)
        run: bun scripts/slot-matrix-check.ts

      # Runs after the build because the Rust tests use the program binaries in target/deploy.
      # The last line compiles the mainnet branch of the code, which the build above never does.
      - name: Clippy
        run: |
          cargo clippy --locked -p brot-markets --all-targets --features no-entrypoint -- -D warnings
          cargo clippy --locked -p brot-markets --all-targets --features no-entrypoint,mainnet -- -D warnings

      - name: Typecheck tests
        run: bunx tsc --noEmit

      - name: TypeScript tests (bun test + LiteSVM)
        run: bun run test

      # Host tests, plus the Mollusk checks on the program binary (SBF_OUT_DIR, set by the script,
      # points Mollusk at target/deploy).
      - name: Rust tests
        run: bun run test:rust

      # T12: the mainnet feature must carry the real minimum duration, review window and entry
      # close, never the drill values. Its test only compiles with `mainnet` on.
      - name: Mainnet build carries the real values
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test --locked -p brot-markets --features no-entrypoint,mainnet

      # Sprint 03 (carried from Sprint 01): Surfpool runs the price reader inside the program's
      # instructions. Pinned by version and by SHA-256, and downloaded rather than piped into a
      # shell: a `curl | bash` whose curl fails exits with bash's status, which is how another
      # project's gate went green having run nothing. Both hashes were computed on 2026-10-09 from
      # the release asset; the archive's equals the digest GitHub publishes for it, and the release
      # publishes no checksum file (knowledge-base/tecnologia/surfpool.md). The repository moved
      # from txtx/surfpool, which redirects here. A mismatch, a missing file or another version
      # fails the step; nothing is extracted before the archive's hash matches.
      - name: Install Surfpool (pinned, checksum-verified)
        env:
          SURFPOOL_VERSION: "1.6.0"
          SURFPOOL_ARCHIVE_SHA256: cb471b00aa3b7d603338eb74ebfec1d23959ecba005b5f1be42ba8d174107fc2
          SURFPOOL_BINARY_SHA256: 53128829df4b482c2ade476bca5bbf6f34f30a4f32bab25e02d2aa5f9de49263
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/surfpool-download"
          bin="$RUNNER_TEMP/surfpool-bin"
          mkdir "$download" "$bin"
          curl -sSfL --retry 3 -o "$download/surfpool-linux-x64.tar.gz" \
            "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz"
          echo "${SURFPOOL_ARCHIVE_SHA256}  $download/surfpool-linux-x64.tar.gz" | sha256sum --check --strict -
          tar -xzf "$download/surfpool-linux-x64.tar.gz" -C "$bin" surfpool
          echo "${SURFPOOL_BINARY_SHA256}  $bin/surfpool" | sha256sum --check --strict -
          chmod +x "$bin/surfpool"
          test "$("$bin/surfpool" --version)" = "surfpool ${SURFPOOL_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      # A mainnet fork through the public RPC: a team campaign on SOL/USD's sponsored account is
      # opened, resolving it is refused before the price moves, then a scenario moves the price
      # across the target and the campaign resolves YES. The script refuses any other Surfpool.
      - name: Price reader on Surfpool (scripts/surfpool/price-touch.ts)
        timeout-minutes: 10
        env:
          SURFPOOL_EXPECTED_VERSION: "1.6.0"
        run: bun run scripts/surfpool/price-touch.ts

      # The program is never built on the shared server (technical plan, section 10). What goes
      # to a cluster is this artifact. It is published only from main and only after every step
      # above passed, so a red run or a pull request never leaves a deployable binary behind.
      # A manual run on main counts: it builds the same commit and needs write access to start,
      # and the push that merged Sprint 00 never triggered this workflow. The SHA-256 file
      # detects a corrupted download, nothing more: it is written by the same job that builds.
      # Provenance attestation is Sprint 16.
      - name: Hash program artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mkdir -p artifacts
          cp target/deploy/brot_markets.so packages/sdk/src/idl/brot_markets.json artifacts/
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload program artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: programs-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  repo:
    name: Repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan compares the branch with its base.
          fetch-depth: 0
          persist-credentials: false

      - name: Code map is up to date
        run: node scripts/codemap.js --check

      - name: Project coherence (os-self-test)
        run: node scripts/os-self-test.js

      # The "coming soon" site has no dependencies, so it needs no install step.
      - name: Landing site tests
        run: >-
          node --test services/landing/tests/leads.test.mjs services/landing/tests/server.test.mjs
          services/landing/tests/pages.test.mjs

      - name: Secret scan over the branch
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/ci-secret-scan.js "$BASE"

  app:
    name: App
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
