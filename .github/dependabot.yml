# Keeps the SHA-pinned actions in ci.yml current. Cargo and npm deps are pinned on purpose
# (pinocchio, shank, mollusk-svm, @solana/kit) and are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
