[package]
name = "brot-markets"
version = "0.0.1"
description = "Brot Markets: pot-based prediction markets resolved by on-chain account reads"
authors = ["Brot Markets"]
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "brot_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Collateral is mainnet USDC instead of Circle devnet USDC.
mainnet = []

[dependencies]
# Same pins as programs/pred-provable; see CLAUDE.md "Gotchas" before changing either.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
