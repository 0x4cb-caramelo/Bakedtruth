[package]
name = "brot-markets"
version = "0.0.3"
description = "Brot Markets: On-Chain Campaigns paid in SOL and answered by reading on-chain accounts"
authors = ["Brot Markets"]
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "brot_markets"

[features]
default = []
# The library without the program entrypoint, for host tests and for crates that link this one.
no-entrypoint = []
# Devnet-only drill values: a short review window and a short minimum duration (T12). The
# `mainnet` feature refuses it at compile time, and CI checks the mainnet values.
drill = []
# The mainnet build. Since money is SOL (D-a) it no longer switches a mint; it only fixes the
# real review window and minimum duration (T12, TP section 3.3).
mainnet = []
# Opens `StakeAtLeast` at `user_open_campaign` (Sprint 03 [AC]). Off in every build until a devnet
# YES is recorded (Sprint 05); `mainnet` refuses it at compile time. Resolution never checks it.
stake-at-least = []

[dependencies]
# Exact pins for program crates (TP section 7). Pinocchio 0.11.2 and its System Program CPIs
# passed the day-one build on 2026-10-08 (Rust 1.89, Solana CLI 3.1.10, platform-tools v1.52).
pinocchio = "=0.11.2"
pinocchio-system = "=0.6.1"
# Attributes only: ShankAccount and ShankInstruction generate no runtime code; shank-cli reads
# them from the source to write the IDL (T9).
shank = "=0.4.9"
# shank-cli reads error codes and messages only from a thiserror-derived enum (T9, lane F). The
# derive's Display and Error impls are never called on-chain. 2.0.21 is the version Cargo.lock
# already held; it declares rust-version 1.77.
thiserror = { version = "=2.0.21", default-features = false }

# Host builds only: deriving a PDA off-chain needs the curve check. The SBF binary uses the
# runtime's syscalls instead, so this never reaches the program.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "=2.8.0", features = ["curve25519"] }

[dev-dependencies]
# The `checks` negatives run the real SBF binary in Mollusk (TP section 9). 0.14.0, not the TP's
# 0.16.0: 0.15 and later build on Agave 4.3, which needs Rust 1.97.1 against the pinned 1.89
# (session log 2026-10-08). Its Solana types are pinned to the versions Mollusk itself uses.
mollusk-svm = "=0.14.0"
solana-account = "=4.7.0"
solana-instruction = "=3.5.1"
solana-pubkey = "=4.4.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Money math must not wrap or truncate in silence. `overflow-checks` in the workspace profile
# covers `+` and `*` at run time; these catch the unchecked operator and the `as` cast at
# review time, so the code uses checked math and `try_from`.
[lints.clippy]
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
