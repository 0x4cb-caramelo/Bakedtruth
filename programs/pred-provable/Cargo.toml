[package]
name = "pred-provable"
version = "0.1.0"
description = "Provable KPI Markets: pari-mutuel markets resolved by on-chain account reads"
authors = ["Ronaldo Pereira"]
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pred_provable"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
# 3.0.0 is the last release on solana-pubkey ^3, which is what anchor-lang 1.1.x uses.
solana-epoch-stake = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
anchor-litesvm = "0.4"
solana-account = "3.4"

# anchor-litesvm links spl-token, which also exports `entrypoint` on host builds.
[[test]]
name = "burn_goal"
required-features = ["no-entrypoint"]
