# Purpose: the gitleaks configuration of this repository: gitleaks' own rules, plus the shapes a Solana
#          project leaks that those rules do not know (keypairs, base58 and hex secrets, RPC keys in URLs,
#          key stores). Read by `node scripts/ci-secret-scan.js` (CI's secret scan, beside the commit hook's
#          patterns) and by any `gitleaks git` or `gitleaks dir` run from the repository root.
# Version: 0.1.0
# Sprint:  16 (hardening), carried from Sprint 00's review (TP section 7.1)
#
# gitleaks matches shapes and cannot check a key's structure. A Solana secret key and a transaction
# signature are both 64 bytes, and the session logs record dozens of signatures, so the base58 and hex rules
# below need a word that names a secret near the value. The structural check that needs no such word (a
# 64-byte value whose second half is the ed25519 public key of its first half) is scripts/ci/solana-keys.js,
# run by the same scan. Binary files are flagged by name there as well: gitleaks' default allowlist skips
# `.bin`, `.exe` and `.dll`, and an extended configuration cannot take that back.
#
# Before allowlisting anything here, read .claude/rules/secrets.md. Never allowlist a real value: rotate it.

title = "Brot Markets: gitleaks defaults plus Solana shapes"

[extend]
useDefault = true

# solana-keygen writes a keypair as one JSON array of 64 byte values (seed, then public key). An address in
# an IDL or a test is 32 values, so a 64-value array is refused whatever its context, as the commit hook does.
[[rules]]
id = "solana-keypair-json-array"
description = "Solana keypair file content: a JSON array of 64 byte values"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''
tags = ["solana", "keypair"]

# A 64-byte secret key in base58 is 86 to 88 characters. Wallets export it that way (Phantom's "private key").
[[rules]]
id = "solana-secret-key-base58"
description = "Solana secret key in base58 (64 bytes) next to a word that names a secret"
regex = '''(?i)(?:secret|private|priv[_-]?key|keypair|seed|mnemonic|chave|privada|secreta|semente)[\w.\-\s"'`:=]{0,40}?\b([1-9A-HJ-NP-Za-km-z]{86,88})\b'''
secretGroup = 1
entropy = 4.0
keywords = ["secret", "private", "priv", "keypair", "seed", "mnemonic", "chave", "privad", "secreta", "semente"]
tags = ["solana", "base58"]

# A 32- or 64-byte secret in hex. SHA-256 digests have the same shape and fill this repository (SHA256SUMS,
# fixtures, feed ids), so the value must follow a word that names a secret.
[[rules]]
id = "hex-secret"
description = "A hex secret (32 or 64 bytes) next to a word that names a secret"
regex = '''(?i)(?:secret|private|priv[_-]?key|seed|password|passwd|hmac|api[_-]?key|chave|privada|senha|segredo)[\w.\-\s"'`:=]{0,30}?\b([0-9a-f]{128}|[0-9a-f]{64})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["secret", "private", "priv", "seed", "password", "passwd", "hmac", "api", "key", "chave", "privad", "senha", "segredo"]
tags = ["hex"]

# RPC providers put the account's key in the URL: https://host/?api-key=<value>.
[[rules]]
id = "url-query-credential"
description = "A credential in a URL's query string"
regex = '''(?i)[?&](?:api[-_]?key|apikey|access[-_]?token|auth[-_]?token|token|key|secret|password)=([A-Za-z0-9_\-.~%]{16,})'''
secretGroup = 1
entropy = 3.0
keywords = ["key=", "token=", "secret=", "password="]
tags = ["url"]

# scheme://user:password@host, in an RPC, a database or a registry URL.
[[rules]]
id = "url-userinfo-password"
description = "A password inside a URL (scheme://user:password@host)"
regex = '''(?i)\b[a-z][a-z0-9+.\-]{1,20}://[^\s/:@'"`]{1,64}:([^\s/@'"`]{3,128})@[a-z0-9][a-z0-9.\-]*'''
secretGroup = 1
keywords = ["://"]
tags = ["url"]

# Android signing keys (the app, Sprint 20 onwards) and other private-key containers. A path rule: the file's
# presence is the finding, whatever it holds.
[[rules]]
id = "key-store-file"
description = "A key store or private-key container (keystore, jks, p12, pfx, bks, kdbx, pem, key, ppk)"
path = '''(?i)\.(?:keystore|jks|p12|pfx|bks|kdbx|pem|key|ppk)$'''
tags = ["file"]

# A compiled binary or an archive can carry a key no text rule reads. The program's binaries come from CI's
# artifact, never from the repository. (`.bin`, `.exe` and `.dll` are checked by scripts/ci-secret-scan.js.)
[[rules]]
id = "binary-or-archive-file"
description = "A compiled binary or an archive committed to the repository"
path = '''(?i)\.(?:so|dylib|o|a|elf|wasm|zip|tar|tgz|gz|bz2|xz|zst|7z|rar|jar|apk|aab|ipa)$'''
tags = ["file"]

# Placeholders in examples and documentation: `${VAR}`, `$VAR`, `<your key>`, YOUR_KEY, EXAMPLE.
[[allowlists]]
description = "Placeholders, not values"
targetRules = ["url-query-credential", "url-userinfo-password", "hex-secret"]
regexes = [
  '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
  '''^<[^>]*>$''',
  '''(?i)^(?:your|example|placeholder|redacted|changeme)[\w.\-]*$''',
  '''(?i)^(?:x{3,}|\*{3,})$''',
]

# The commit hook's own test file holds one fake sample per pattern; scripts/ci-secret-scan.js exempts it the
# same way. Nothing else is exempt.
[[allowlists]]
description = "The secret scanner's own test samples"
paths = ['''^scripts/test/hooks\.test\.js$''']
