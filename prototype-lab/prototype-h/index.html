<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baked · Prism (direction H)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="net" aria-hidden="true"></canvas>

<header class="top">
  <button class="brand" data-action="home" aria-label="baked home">
    <img src="../shared/mascot/deadpan.png" alt="">
    <span>baked</span>
  </button>
  <nav class="cats" aria-label="Market categories">
    <button data-category="All" aria-pressed="true">Trending</button>
    <button data-category="Burn">Burn</button>
    <button data-category="Renounce">Renounce</button>
    <button data-category="Lock">Lock</button>
    <button data-category="Immutable">Immutable</button>
    <button data-category="Stake">Stake</button>
  </nav>
  <label class="search">
    <i data-icon="search"></i>
    <input data-role="search" type="search" placeholder="Search markets or accounts" aria-label="Search markets">
  </label>
  <span class="chain-chip"><i></i>Solana Devnet</span>
  <button class="cta" data-action="wallet" data-mood="tapping"><span>Connect wallet</span></button>
</header>

<main>
  <div class="notice" data-role="notice" hidden role="status">
    <span data-role="notice-text"></span>
    <button data-action="dismiss" aria-label="Dismiss notification">×</button>
  </div>

  <section data-screen="home">
    <div class="mosaic" data-role="mosaic">
      <section class="carousel glass" data-role="carousel" data-perch="carousel" data-perch-x="0.92" data-perch-size="1.1" data-perch-pose="point" data-perch-say="Read the account.">
        <div class="box-head">
          <h2><i class="live"></i>Trading now</h2>
          <div class="pager">
            <button data-mosaic="prev" aria-label="Previous market"><i data-icon="arrow-left" data-size="14"></i></button>
            <span class="dots" data-role="dots"></span>
            <button data-mosaic="next" aria-label="Next market"><i data-icon="arrow-right" data-size="14"></i></button>
          </div>
        </div>
        <div class="slides" data-role="slides" aria-live="polite"></div>
      </section>
      <div class="side">
        <section class="side-box glass" data-perch="upcoming" data-perch-x="0.88" data-perch-size="0.8" data-perch-pose="impatient">
          <div class="box-head"><h2>Upcoming</h2><span class="hint">Sale not open yet</span></div>
          <div data-role="upcoming"></div>
        </section>
        <section class="side-box glass">
          <div class="box-head"><h2>Closing soon</h2><span class="hint">By deadline</span></div>
          <div data-role="closing"></div>
        </section>
      </div>
    </div>

    <div class="how-row"><button class="link" data-action="explain">How it works <i data-icon="arrow-right" data-size="14"></i></button></div>
    <div class="steps" data-role="explain" hidden id="steps"></div>
    <div class="principles" id="principles"></div>

    <div class="toolbar">
      <div class="filters">
        <button data-status="Active" aria-pressed="true">Active</button>
        <button data-status="Closing soon">Closing soon</button>
        <button data-status="Resolved">Resolved</button>
        <button data-status="Saved">Saved</button>
      </div>
      <span class="count" data-role="count" aria-live="polite"></span>
      <select data-role="sort" aria-label="Sort markets">
        <option value="volume">Volume</option>
        <option value="deadline">Deadline</option>
        <option value="yes">YES price</option>
      </select>
    </div>

    <div class="grid" data-role="grid"></div>
    <div class="empty" data-role="empty" hidden>
      <img src="../shared/mascot/sulking.png" alt="Baked, sulking">
      <p>Nothing on-chain matches that.</p>
      <button class="link" data-action="reset">Clear filters</button>
    </div>
  </section>

  <section data-screen="detail" hidden>
    <div data-role="detail"></div>
  </section>
</main>

<footer class="foot" data-perch="foot" data-perch-x="0.5" data-perch-pose="tired">
  <span>baked · KPI markets on Solana</span>
  <span>Devnet · Example data · Not audited</span>
</footer>

<script src="../shared/mock-data.js"></script>
<script src="../shared/app.js"></script>
<script src="../shared/mascot.js"></script>
<script src="../shared/mosaic.js"></script>
<script src="view.js"></script>
</body>
</html>
