<!doctype html>
<!-- Direction N · Ledger² Light. Purpose: D's page (same markup) with a light theme and a switch
     back to D's dark. Version: 0.1 · Phase 3 (Prototype Lab), 2026-10-03. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baked · Ledger² Light (direction N)</title>
<script>
  // Before first paint: ?theme=dark|light wins, then the saved choice, then light.
  (() => {
    let theme = new URLSearchParams(location.search).get("theme");
    try {
      theme = theme || localStorage.getItem("baked-theme");
    } catch {}
    document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>

<div class="status">
  <span><b>● Solana Devnet</b> · Design preview</span>
  <span>Example markets · Not audited</span>
</div>

<header class="top">
  <button class="brand" data-action="home" aria-label="baked home">
    <img src="../shared/mascot/deadpan.png" alt=""><span>baked</span>
  </button>
  <label class="search">
    <i data-icon="search"></i>
    <input data-role="search" type="search" placeholder="Search markets, tokens, addresses" aria-label="Search markets">
  </label>
  <div class="top-actions">
    <button class="link" data-action="explain">How it works</button>
    <button class="theme" data-theme-toggle type="button">
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="cta" data-action="wallet"><span>Connect wallet</span></button>
  </div>
</header>

<nav class="cats" aria-label="Market categories">
  <button data-category="All" aria-pressed="true"><i data-icon="trending"></i>Trending</button>
  <button data-category="Burn">Burn</button>
  <button data-category="Renounce">Renounce</button>
  <button data-category="Lock">Lock</button>
  <button data-category="Immutable">Immutable</button>
  <button data-category="Stake">Stake</button>
  <button class="sponsor" data-action="sponsor">Sponsor a goal <i data-icon="arrow-up-right" data-size="14"></i></button>
</nav>

<main>
  <div class="notice" data-role="notice" hidden role="status">
    <span data-role="notice-text"></span>
    <button data-action="dismiss" aria-label="Dismiss notification">×</button>
  </div>

  <section data-screen="home">
    <div class="mosaic" data-role="mosaic">
      <section class="carousel" data-role="carousel" data-perch="carousel" data-perch-x="0.84" data-perch-size="1.3" data-perch-say="Trading now.">
        <div class="carousel-head">
          <span class="kicker"><i data-icon="trending"></i> Trading now</span>
          <div class="pager">
            <button data-mosaic="prev" aria-label="Previous market"><i data-icon="arrow-left"></i></button>
            <span class="dots" data-role="dots"></span>
            <button data-mosaic="next" aria-label="Next market"><i data-icon="arrow-right"></i></button>
          </div>
        </div>
        <div class="slides" data-role="slides" aria-live="polite"></div>
      </section>
      <div class="side">
        <section class="side-box" data-perch="upcoming" data-perch-x="0.84" data-perch-size="0.8" data-perch-pose="impatient" data-perch-say="Not open yet.">
          <h2>Upcoming</h2>
          <div class="side-list" data-role="upcoming"></div>
        </section>
        <section class="side-box">
          <h2>Closing soon</h2>
          <div class="side-list" data-role="closing"></div>
        </section>
      </div>
    </div>

    <div class="steps" data-role="explain" hidden id="steps"></div>
    <div class="principles" id="principles"></div>

    <div class="toolbar" data-perch="toolbar" data-perch-x="0.5" data-perch-size="0.8" data-perch-pose="skeptical">
      <div class="filters">
        <button data-status="Active" aria-pressed="true">Active</button>
        <button data-status="Closing soon">Closing soon</button>
        <button data-status="Resolved">Resolved</button>
        <button data-status="Saved">Saved</button>
      </div>
      <div class="toolbar-right">
        <span class="count" data-role="count" aria-live="polite"></span>
        <select data-role="sort" aria-label="Sort markets">
          <option value="volume">Volume ↓</option>
          <option value="deadline">Deadline ↑</option>
          <option value="yes">YES price ↓</option>
        </select>
      </div>
    </div>

    <div class="grid" data-role="grid" id="grid"></div>
    <div class="empty" data-role="empty" hidden>
      <img src="../shared/mascot/sulking.png" alt="Baked, sulking">
      <p>No markets here yet.</p>
      <button data-action="reset">Clear filters</button>
    </div>
  </section>

  <section data-screen="detail" hidden>
    <div data-role="detail"></div>
  </section>
</main>

<footer class="foot" data-perch="foot" data-perch-x="0.5" data-perch-size="0.9" data-perch-pose="tired" data-perch-say="Not audited. Stay sharp.">
  <span>baked · KPI markets on Solana</span>
  <span>Devnet · Example data · Not audited</span>
</footer>

<script src="../shared/mock-data.js"></script>
<script src="../shared/app.js"></script>
<script src="../shared/mascot.js"></script>
<script src="../shared/mosaic.js"></script>
<script src="../shared/ledger.js"></script>
<script src="view.js"></script>
</body>
</html>
