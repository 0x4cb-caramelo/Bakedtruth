skip_local_validator = true

[toolchain]
anchor_version = "1.1.2"
package_manager = "bun"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pred_provable = "F9KfegHTBzeHmkhUxgvpTzYD8xvwRmV3sue2BVXiKoE2"

[programs.devnet]
pred_provable = "F9KfegHTBzeHmkhUxgvpTzYD8xvwRmV3sue2BVXiKoE2"

# Anchor builds only the frozen pred-provable, until Sprint 03 removes it with the Anchor CLI.
# programs/brot-markets is a Pinocchio program since Sprint 02: `cargo build-sbf` builds it and
# shank-cli writes its IDL (`bun run build:program`).
[workspace]
exclude = ["programs/brot-markets"]

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Tests run in-process on LiteSVM, so no local validator is needed.
# `bun test` takes directory filters; a `tests/**/*.ts` glob would be expanded by sh
# without globstar and miss files directly under tests/.
test = "bun test tests/"
test-rust = "bun run test:rust"

