# Purpose: the build settings of the site at brot.markets/dev0x (deploy/vps/README.md, "The site under /dev0x"). Every
#          NEXT_PUBLIC_* value is inlined in the bundle and ships to every browser, so nothing here is a secret, and the
#          build refuses an RPC URL that carries a key. Build again after every program upgrade (A-8).
# The path the tunnel sends to the site; the domain's root stays the landing.
NEXT_PUBLIC_BASE_PATH=/dev0x
NEXT_PUBLIC_CLUSTER=devnet
# The browser's RPC: the public devnet endpoint, until the relay is installed and the site moves to /rpc (answer 3a).
NEXT_PUBLIC_RPC_URL=https://api.devnet.solana.com
# The read API, on the same host through the tunnel's /api/v1 route: same origin as the site, so no CORS.
NEXT_PUBLIC_API_URL=https://brot.markets
NEXT_TELEMETRY_DISABLED=1
